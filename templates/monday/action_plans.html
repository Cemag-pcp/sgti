{% extends "base.html" %}

{% block title %}Planos de Ação SGQ - SGTI{% endblock %}

{% block page_title %}Planos de Ação (SGQ){% endblock %}

{% block header_actions %}
<button type="button" id="monday-refresh-btn" class="btn-secondary">
  <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/>
  </svg>
  Atualizar dados
</button>
{% endblock %}

{% block content %}
<section id="monday-content" class="space-y-5" data-data-url="{% url 'monday:action_plans_data' %}">
  <div class="rounded-2xl border border-gray-200 bg-white p-10 text-center shadow-sm">
    <svg class="mx-auto h-6 w-6 animate-spin text-blue-500" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
    </svg>
    <p class="mt-3 text-sm text-gray-400">Carregando dados do Monday...</p>
  </div>
</section>

<script>
  (function () {
    var container = document.getElementById('monday-content');
    var refreshBtn = document.getElementById('monday-refresh-btn');
    var dataUrl = container.dataset.dataUrl;

    function showLoading() {
      container.innerHTML = ''
        + '<div class="rounded-2xl border border-gray-200 bg-white p-10 text-center shadow-sm">'
        + '  <svg class="mx-auto h-6 w-6 animate-spin text-blue-500" fill="none" viewBox="0 0 24 24">'
        + '    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>'
        + '    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>'
        + '  </svg>'
        + '  <p class="mt-3 text-sm text-gray-400">Carregando dados do Monday...</p>'
        + '</div>';
    }

    function loadContent(forceRefresh) {
      var params = new URLSearchParams(window.location.search);
      if (forceRefresh) params.set('refresh', '1');
      var url = dataUrl + '?' + params.toString();

      showLoading();
      fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' }, credentials: 'same-origin' })
        .then(function (response) {
          if (!response.ok) throw new Error('bad_response');
          return response.text();
        })
        .then(function (html) {
          container.innerHTML = html;
        })
        .catch(function () {
          container.innerHTML = '<div class="rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">Não foi possível carregar os dados do Monday. Tente novamente.</div>';
        });
    }

    // Delegação de evento: funciona mesmo depois do conteúdo ser trocado pelo fetch.
    container.addEventListener('click', function (e) {
      var row = e.target.closest('[data-toggle-detail]');
      if (!row) return;
      var detail = document.getElementById(row.dataset.toggleDetail);
      var icon = row.querySelector('[data-toggle-icon]');
      if (!detail) return;
      detail.classList.toggle('hidden');
      if (icon) icon.classList.toggle('rotate-90');
    });

    if (refreshBtn) {
      refreshBtn.addEventListener('click', function () {
        loadContent(true);
      });
    }

    loadContent(false);
  })();
</script>
{% endblock %}
